name: Run tests on keyword

on:
  pull_request_review_comment:
    types: [ edited ]

jobs:
  execute-command:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '/run-tests')}}
    runs-on: ubuntu-latest

    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # needs to check out PR commit otherwise default branch will be used
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest

      - name: Run Instrumented (UI) Tests
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/androidTests/**
